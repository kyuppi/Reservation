<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>予約受付</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script defer src="js/config.js"></script>
  <script defer src="js/api.js"></script>
  <script defer src="js/app.js"></script>
</head>
<body class="customer-page">
  <div id="loading" class="loading-overlay">
    <div class="loading-card"><div class="spinner"></div><p>予約画面を読み込んでいます…</p></div>
  </div>

  <header class="hero" id="hero">
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <div class="brand-mark">WEB RESERVATION</div>
      <h1 id="storeName">店舗予約</h1>
      <p>ご来店日時とご注文内容を入力してください</p>
    </div>
  </header>

  <main class="container customer-main">
    <div id="message" class="message" hidden></div>

    <section class="card">
      <div class="section-heading">
        <span class="step">01</span>
        <div><h2>ご来店日時</h2><p>臨時休業日は選択できません</p></div>
      </div>
      <div class="form-grid two">
        <label class="field">
          <span>ご来店日 <b>*</b></span>
          <input id="visitDate" type="date" required>
        </label>
        <label class="field">
          <span>ご来店時間 <b>*</b></span>
          <input id="visitTime" type="time" required>
        </label>
      </div>
      <div id="holidayHint" class="hint" hidden></div>
    </section>

    <section class="card">
      <div class="section-heading">
        <span class="step">02</span>
        <div><h2>ご注文</h2><p>メニューと数量を選択してください</p></div>
      </div>
      <div id="menuList" class="menu-list"></div>
      <div id="emptyMenu" class="empty-state" hidden>現在、受付可能なメニューがありません。</div>
      <div class="order-total-row"><span>合計</span><strong id="orderTotal">¥0</strong></div>
    </section>

    <section class="card">
      <div class="section-heading">
        <span class="step">03</span>
        <div><h2>お客様情報</h2><p>予約確認のために必要です</p></div>
      </div>
      <div class="form-grid two">
        <label class="field">
          <span>お名前 <b>*</b></span>
          <input id="customerName" type="text" placeholder="山田 太郎" autocomplete="name" maxlength="80" required>
        </label>
        <label class="field">
          <span>ご来店人数 <b>*</b></span>
          <input id="guests" type="number" min="1" max="99" value="2" required>
        </label>
      </div>
      <div class="contact-choice">
        <span class="contact-label">連絡先（電話番号またはメールアドレス）<b>*</b></span>
        <div class="form-grid two">
          <label class="field"><span>電話番号</span><input id="phone" type="tel" placeholder="090-1234-5678" autocomplete="tel" maxlength="30"></label>
          <label class="field"><span>メールアドレス</span><input id="email" type="email" placeholder="example@example.com" autocomplete="email" maxlength="160"></label>
        </div>
      </div>
    </section>

    <section class="card summary-card">
      <div class="section-heading compact">
        <div><h2>予約内容の確認</h2><p>内容をご確認のうえ予約を送信してください</p></div>
      </div>
      <div id="summary" class="summary"></div>
      <button id="reserveButton" class="primary-button" type="button">この内容で予約する</button>
      <p class="privacy-note">送信された情報は店舗の予約管理に使用します。</p>
    </section>
  </main>

  <footer class="site-footer">
    <p>© <span id="year"></span> <span id="footerStoreName">店舗予約</span></p>
  </footer>

  <div id="successModal" class="modal" hidden aria-hidden="true">
    <div class="modal-backdrop"></div>
    <div class="modal-card">
      <div class="success-icon">✓</div>
      <h2>予約を受け付けました</h2>
      <p id="successText">ご予約ありがとうございます。</p>
      <button id="closeSuccess" class="primary-button" type="button">閉じる</button>
    </div>
  </div>
</body>
</html>
